name: Build and publish Vireon Noctis

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [spotify_now_playing_updated]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: portfolio-static-publish
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check Vue components
        run: npm run typecheck

      - name: Build Vue application
        run: npm run build

      - name: Inline generated CSS and JavaScript
        run: node scripts/inline-pages.mjs

      - name: Verify branch deployment output
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          checks = {
              "dist/index.html": Path("dist/index.html").is_file() and Path("dist/index.html").stat().st_size > 0,
              "dist/signature/index.html": Path("dist/signature/index.html").is_file() and Path("dist/signature/index.html").stat().st_size > 0,
              "dist/.nojekyll": Path("dist/.nojekyll").is_file(),
              "dist/404.html": Path("dist/404.html").is_file() and Path("dist/404.html").stat().st_size > 0,
              "dist/robots.txt": Path("dist/robots.txt").is_file() and Path("dist/robots.txt").stat().st_size > 0,
              "dist/sitemap.xml": Path("dist/sitemap.xml").is_file() and Path("dist/sitemap.xml").stat().st_size > 0,
              "dist/spotify-now-playing.json": Path("dist/spotify-now-playing.json").is_file(),
              "dist/brands": Path("dist/brands").is_dir(),
              "no generated assets directory": not Path("dist/assets").exists(),
          }

          root = Path("dist/index.html").read_text() if Path("dist/index.html").exists() else ""
          legacy = Path("dist/signature/index.html").read_text() if Path("dist/signature/index.html").exists() else ""
          checks["root page has no external Vite assets"] = not re.search(r'<script[^>]+src="/assets/|<link[^>]+href="/assets/', root)
          checks["legacy page has no external Vite assets"] = not re.search(r'<script[^>]+src="/assets/|<link[^>]+href="/assets/', legacy)
          checks["legacy page identifies redirect"] = "Vireon Signature has moved" in legacy
          checks["legacy page targets standalone project"] = "Vireon-Signature/" in legacy
          checks["legacy page redirects automatically"] = "location.replace" in legacy

          for name, passed in checks.items():
              print(("PASS" if passed else "FAIL") + "  " + name)

          if not all(checks.values()):
              sys.exit(1)
          PY

      - name: Publish built files to the Pages branch
        if: github.event_name != 'pull_request'
        run: |
          rm -rf assets
          cp -R dist/. .
          test -s index.html
          test -s signature/index.html
          test -d brands
          test ! -d assets

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- .nojekyll 404.html index.html robots.txt sitemap.xml spotify-now-playing.json brands signature vireon-mark.svg vireon-preview.svg
          if ! git diff --cached --quiet; then
            git commit -m "Publish inline portfolio build [skip ci]"
            git push origin HEAD:main
          else
            echo "The Pages branch already contains this build."
          fi

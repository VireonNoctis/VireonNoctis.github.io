name: Build and publish Vireon Noctis

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [spotify_now_playing_updated]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: portfolio-static-publish
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check Vue components
        run: npm run typecheck

      - name: Build Vue application
        run: npm run build

      - name: Inline generated CSS and JavaScript
        run: node scripts/inline-pages.mjs

      - name: Verify branch deployment output
        run: |
          test -s dist/index.html
          test -f dist/.nojekyll
          test -s dist/404.html
          test -s dist/robots.txt
          test -s dist/sitemap.xml
          test -s dist/spotify-now-playing.json
          test -d dist/brands
          test ! -d dist/assets
          ! grep -Eq '<script[^>]+src="/assets/|<link[^>]+href="/assets/' dist/index.html

      - name: Publish built files to the Pages branch
        if: github.event_name != 'pull_request'
        run: |
          rm -rf assets
          cp -R dist/. .
          test -s index.html
          test -d brands
          test ! -d assets

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- .nojekyll 404.html index.html robots.txt sitemap.xml spotify-now-playing.json brands vireon-mark.svg vireon-preview.svg
          if ! git diff --cached --quiet; then
            git commit -m "Publish inline portfolio build [skip ci]"
            git push origin HEAD:main
          else
            echo "The Pages branch already contains this build."
          fi

name: Build and publish Vireon Noctis

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [spotify_now_playing_updated]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: portfolio-static-publish
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check Vue components
        run: npm run typecheck

      - name: Build and copy compiled site to Pages root
        run: npm run build

      - name: Verify branch deployment files
        run: |
          test -s index.html
          test -f .nojekyll
          test -s robots.txt
          test -s sitemap.xml
          test -d brands
          test -d assets
          ! grep -q '/src/main.ts\|/main.ts' index.html
          grep -Eq 'assets/[^"]+\.js' index.html
          grep -Eq 'assets/[^"]+\.css' index.html

      - name: Commit compiled Pages output
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- .nojekyll 404.html index.html assets brands robots.txt sitemap.xml spotify-now-playing.json vireon-mark.svg vireon-preview.svg
          if ! git diff --cached --quiet; then
            git commit -m "Publish compiled portfolio site [skip ci]"
            git push origin HEAD:main
          else
            echo "The deployed static snapshot is already current."
          fi

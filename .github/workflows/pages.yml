name: Build and deploy Vireon Noctis

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [spotify_now_playing_updated]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: portfolio-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check Vue components
        run: npm run typecheck

      - name: Build site
        run: npm run build

      - name: Verify Pages output
        run: |
          test -s dist/index.html
          test -f dist/.nojekyll
          test -s dist/404.html
          test -s dist/robots.txt
          test -s dist/sitemap.xml
          test -s dist/spotify-now-playing.json
          test -d dist/brands
          test -d dist/assets
          ! grep -q '/src/main.ts\|/main.ts' dist/index.html
          grep -Eq 'assets/[^"]+\.js' dist/index.html
          grep -Eq 'assets/[^"]+\.css' dist/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

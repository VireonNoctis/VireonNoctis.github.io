name: Refresh Spotify listening status

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spotify-now-playing
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch Spotify playback state
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: |
          if [[ -z "$SPOTIFY_CLIENT_ID" || -z "$SPOTIFY_CLIENT_SECRET" || -z "$SPOTIFY_REFRESH_TOKEN" ]]; then
            echo "::warning::Spotify is not configured. Add SPOTIFY_CLIENT_ID, SPOTIFY_CLIENT_SECRET, and SPOTIFY_REFRESH_TOKEN in repository Actions secrets."
            exit 0
          fi

          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";

          const clientId = process.env.SPOTIFY_CLIENT_ID;
          const clientSecret = process.env.SPOTIFY_CLIENT_SECRET;
          const refreshToken = process.env.SPOTIFY_REFRESH_TOKEN;
          const basic = Buffer.from(`${clientId}:${clientSecret}`).toString("base64");

          const tokenResponse = await fetch("https://accounts.spotify.com/api/token", {
            method: "POST",
            headers: {
              Authorization: `Basic ${basic}`,
              "Content-Type": "application/x-www-form-urlencoded"
            },
            body: new URLSearchParams({
              grant_type: "refresh_token",
              refresh_token: refreshToken
            })
          });

          if (!tokenResponse.ok) {
            throw new Error(`Spotify token refresh failed (HTTP ${tokenResponse.status}). Check the app credentials and refresh token secrets.`);
          }

          const tokenData = await tokenResponse.json();
          if (!tokenData.access_token) throw new Error("Spotify did not return an access token.");

          const playbackResponse = await fetch("https://api.spotify.com/v1/me/player/currently-playing", {
            headers: { Authorization: `Bearer ${tokenData.access_token}` }
          });

          let next;
          if (playbackResponse.status === 204) {
            next = { configured: true, isPlaying: false, track: null, artist: null, album: null, albumImage: null, url: null };
          } else {
            if (!playbackResponse.ok) {
              throw new Error(`Spotify playback request failed (HTTP ${playbackResponse.status}). Check the app's API access and granted scope.`);
            }
            const playback = await playbackResponse.json();
            const item = playback?.currently_playing_type === "track" && playback?.item?.type === "track" ? playback.item : null;
            next = {
              configured: true,
              isPlaying: Boolean(playback?.is_playing && item),
              track: item?.name ?? null,
              artist: item?.artists?.map((artist) => artist.name).filter(Boolean).join(", ") || null,
              album: item?.album?.name ?? null,
              albumImage: item?.album?.images?.[0]?.url ?? null,
              url: item?.external_urls?.spotify ?? null
            };
          }

          const path = "public/spotify-now-playing.json";
          const content = JSON.stringify(next, null, 2) + "\n";
          let previous = "";
          try { previous = readFileSync(path, "utf8"); } catch {}
          if (previous.trim() === content.trim()) {
            console.log("Spotify playback state is unchanged; no deploy is needed.");
          } else {
            writeFileSync(path, content);
            console.log("Spotify playback state changed; publishing a new static snapshot.");
          }
          NODE

      - name: Commit changed playback snapshot
        id: publish
        run: |
          if git diff --quiet -- public/spotify-now-playing.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/spotify-now-playing.json
          git commit -m "chore: refresh Spotify listening status"
          git push origin main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger GitHub Pages deployment
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" -f event_type=spotify_now_playing_updated

[package]
name = "vireon-noctis-api"
version = "0.2.0"
edition = "2021"
description = "Rust/Axum API companion for the Vireon Noctis website"
license = "MIT"

[dependencies]
axum = { version = "0.8", features = ["json"] }
rand = "0.8"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync"] }
url = "2"
